{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content_anon %}
{% load static %}
<div class="login-card">
  <img src="{% static 'img/logo.png' %}" alt="Soluciones Exactas, S.A." class="brandmark">
  <div>
    <h1 class="page-title" style="font-size:1.2rem;">Sistema de Control de Bodega</h1>
    <p class="page-sub" style="margin-top:2px;">Soluciones Exactas, S.A.</p>
  </div>

  {% if form.errors %}
    <p style="color:var(--state-critical-fg); font-size:.85rem;">Usuario o contraseña incorrectos.</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div>
      <label for="id_username">Usuario</label>
      <input id="id_username" name="username" type="text" required autofocus autocapitalize="none">
    </div>
    <div>
      <label for="id_password">Contraseña</label>
      <input id="id_password" name="password" type="password" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary btn-block" style="padding:12px; font-size:.95rem;">Iniciar sesión</button>
  </form>
</div>
{% endblock %}
